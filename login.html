<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Connect - Вход</title>
    
    <style>
        :root {
            --background-image: url('https://media.istockphoto.com/id/598520904/photo/green-forest-foliage-aerial-view-woodland-tree-canopy-nature-background.jpg?s=612x612&w=0&k=20&c=RcCcRuTBBqnaZ_58Q1o9NGNUxRg-tlPzK_jTjpPIpM4=');
        }
        
        /* Стили для полноэкранной модалки */
        #userTypeModal {
            background: rgba(27, 94, 32, 0.95) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
        }
        
        #userTypeModal .modal-content {
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(30px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5) !important;
            max-width: 500px !important;
            width: 90% !important;
            padding: 3rem 2rem !important;
        }
        
        .user-type-content {
            text-align: center;
        }
        
        .user-type-icon {
            font-size: 5rem;
            color: #4caf50;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
        }
        
        .user-type-content h3 {
            color: white;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .user-type-content p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        .user-type-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .user-type-buttons .btn {
            padding: 1.2rem;
            font-size: 1.1rem;
            justify-content: center;
        }
        
        .user-type-buttons .btn i {
            margin-right: 0.5rem;
        }
    </style>
    
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Модальное окно выбора типа пользователя - ПОЛНОЭКРАННОЕ -->
    <div id="userTypeModal" class="modal show" style="display: flex; align-items: center; justify-content: center;">
        <div class="modal-content">
            <div class="user-type-content">
                <div class="user-type-icon">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h3>Добро пожаловать!</h3>
                <p>Выберите, пожалуйста, кто вы:</p>
                <div class="user-type-buttons">
                    <button class="btn btn-primary btn-large" id="existingUserBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        У меня уже есть аккаунт
                    </button>
                    <button class="btn btn-secondary btn-large" id="newUserBtn">
                        <i class="fas fa-user-plus"></i>
                        Я новый пользователь
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo">
                    <i class="fas fa-leaf"></i>
                    Eco-Connect
                </h1>
                <p class="auth-subtitle">Войдите в свой аккаунт</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="Введите ваш email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required placeholder="Введите ваш пароль">
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Запомнить меня
                    </label>
                    <a href="#" class="forgot-password">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-large">
                    <i class="fas fa-sign-in-alt"></i>
                    Войти
                </button>
            </form>

            <div class="auth-footer">
                <p>Нет аккаунта? <a href="register.html" class="auth-link">Зарегистрироваться</a></p>
            </div>

            <div class="auth-features">
                <div class="feature">
                    <i class="fas fa-hands-helping"></i>
                    <span>Присоединяйтесь к мероприятиям</span>
                </div>
                <div class="feature">
                    <i class="fas fa-map-marked-alt"></i>
                    <span>Отслеживайте мероприятия на карте</span>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <span>Следите за своей статистикой</span>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="scripts/database.js"></script>
    <script src="scripts/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userTypeModal = document.getElementById('userTypeModal');
            const existingUserBtn = document.getElementById('existingUserBtn');
            const newUserBtn = document.getElementById('newUserBtn');
            
            // Проверяем, был ли уже выбор
            const userTypeSelected = sessionStorage.getItem('userTypeSelected');
            
            if (userTypeSelected) {
                userTypeModal.style.display = 'none';
                userTypeModal.classList.remove('show');
                sessionStorage.removeItem('userTypeSelected');
            }
            
            // "У меня уже есть аккаунт" - остаемся на login.html
            existingUserBtn.addEventListener('click', function() {
                sessionStorage.setItem('userTypeSelected', 'existing');
                userTypeModal.style.display = 'none';
                userTypeModal.classList.remove('show');
            });
            
            // "Я новый пользователь" - переходим на register.html
            newUserBtn.addEventListener('click', function() {
                sessionStorage.setItem('userTypeSelected', 'new');
                window.location.href = 'register.html';
            });
        });
    </script>
</body>
</html>
